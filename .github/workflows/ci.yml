name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# A push and its pull request would otherwise run the same commit twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Two roles, exactly as production has them, because a single superuser
  # connection would silently bypass row-level security and turn every tenancy
  # test into a test of nothing.
  DIRECT_DATABASE_URL: postgresql://itqan:itqan@localhost:5432/itqan_test
  DATABASE_URL: postgresql://itqan_app:itqan_app@localhost:5432/itqan_test
  SESSION_SECRET: ci-only-secret-not-production-0123456789abcdef

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Role attributes are provisioning, not schema: a migration cannot grant
      # itself privileges it does not hold, so this runs as the superuser first.
      - name: Provision database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f prisma/provision.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE itqan PASSWORD 'itqan'; ALTER ROLE itqan_app PASSWORD 'itqan_app';"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE itqan_test OWNER itqan;"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Migrate
        env:
          # Migrations run as the owning role, never as the application role.
          DATABASE_URL: ${{ env.DIRECT_DATABASE_URL }}
        run: pnpm db:generate && pnpm exec prisma migrate deploy

      - run: pnpm test:integration

      - name: Install Chromium for the muṣḥaf glyph check
        run: pnpm exec playwright install --with-deps chromium
      - name: Content gates
        run: pnpm gates

      - run: pnpm build
      - name: Performance budget
        run: node scripts/check_budgets.mjs
      - run: pnpm audit --prod --audit-level high || true

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Provision database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f prisma/provision.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE itqan PASSWORD 'itqan'; ALTER ROLE itqan_app PASSWORD 'itqan_app';"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE itqan_test OWNER itqan;"

      - name: Migrate and seed
        env:
          DATABASE_URL: ${{ env.DIRECT_DATABASE_URL }}
        run: |
          pnpm db:generate
          pnpm exec prisma migrate deploy
          pnpm exec tsx scripts/seed_dev.ts
          pnpm exec tsx scripts/seed_demo.ts --days 30

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
