name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: itqan
          POSTGRES_PASSWORD: itqan
          POSTGRES_DB: itqan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://itqan:itqan@localhost:5432/itqan_test
      SESSION_SECRET: ci-only-secret-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:generate && pnpm prisma migrate deploy
      - run: pnpm test:integration
      - name: Content gates
        run: pnpm gates
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high || true

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: itqan
          POSTGRES_PASSWORD: itqan
          POSTGRES_DB: itqan_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://itqan:itqan@localhost:5432/itqan_e2e
      SESSION_SECRET: ci-only-secret-not-production
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm prisma migrate deploy && pnpm exec tsx scripts/seed_dev.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
